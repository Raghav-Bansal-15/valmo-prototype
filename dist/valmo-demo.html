  else if(status==='accepted') confirmation=`<div class="decision"><h3>Accepted. Ready to re-dispatch.</h3><p>${buyer.name} accepted this exact offer. Relabel the parcel and assign a local delivery. Seller sale follows the standard commission cycle.</p>${btn('Re-dispatch locally','reuse-dispatch')}${btn('Buyer withdraws · find another','reuse-decline','secondary')}</div>`;
  else if(status==='dispatched') confirmation=`<div class="decision"><h3>Await the delivery outcome</h3><p>The same parcel is on its second delivery. The journey is complete only when the new buyer receives it.</p>${btn('Simulate successful delivery','reuse-deliver')}${btn('Simulate failed rematch · normal reverse','reuse-reverse','secondary')}</div>`;

  return `${flows()}<div class="reuse-progress" aria-label="Reuse journey">${['Item at hub','Nearby demand','Match & confirm','Re-dispatch','Delivery outcome'].map((t,i)=>`<div class="${stageIndex>=i+1?'done':''}"><span>${i+1}</span>${t}</div>`).join('')}</div>
    <section class="reuse-summary ${decision.eligible&&status!=='returned'?'eligible':''}" role="status" aria-live="polite"><div>${pill(status==='ready'?decision.eligible?'Eligible refusal':'Recovery / exception':status,'plum')}<h3>${summary}</h3><p>${summaryText}</p></div><span class="reuse-summary-parcel">${o.id} · Delhi SC</span></section>
    <div class="module-grid reuse-grid">${triage}<div class="stack">${panel('2. Find nearby demand','Match the product to the next buyer',demand)}${panel('3–5. Confirm, re-dispatch, deliver','Separate actions with a visible outcome',confirmation)}</div></div><div class="spaced">${economics}</div>`;
}

${(d.costs||[['Original route',170]]).map(([t,c])=>`<div class="cost"><span>${t}</span><b>${money(c)}</b></div>`).join('')}<div class="cost total"><span>Total scenario cost</span><b>${money(d.total)}</b></div></div><div class="saving"><span>Net saving vs. baseline</span><strong>${money(d.saving)}</strong></div><div class="spaced">${btn(state.actions[o.id+':intercept']?'Route committed':'Commit simulated route '+icon('arrow'),'commit-route','full-width',!d.allowed||!!state.actions[o.id+':intercept'])}</div><p class="help-text">Savings include handling, transport, and ₹10 operating cost. They are scenario calculations, not realised pilot results.</p>`,'','2')}${panel('Why two hubs?','The deck’s planning case',`<p class="muted" style="font-size:11px">If Delhi has no compatible buyer, try Jaipur. If neither has demand, partial reverse from Delhi still avoids the full onward route.</p><div class="mini-metrics spaced"><div class="mini-metric"><small>Delhi share</small><strong>20%</strong></div><div class="mini-metric"><small>Jaipur share</small><strong>25%</strong></div><div class="mini-metric"><small>Combined match</small><strong>45%</strong></div></div>`)}</div></div>`;}
function impact(){const expected=weightedSavings(form.delhiShare,form.jaipurShare);return `<div class="metrics">${metric('Simulated savings',money(state.savings),'Committed routing actions in this browser','chart')}${metric('Verified attempts',String(Object.values(state.verified).filter(Boolean).length),'Rule checks on synthetic telemetry','shield')}${metric('Buyer rematches',String(Object.values(state.matches).filter(Boolean).length),'Confirmed synthetic buyer scenarios','reuse')}${metric('Deck target','12–25%','Illustrative RTO reduction in targeted lanes','route')}</div><div class="module-grid">${panel('Interception economics sandbox','Change match shares to stress-test the planning case',`<div class="eyebrow muted">Expected net saving per intercepted parcel</div><div class="big-number">${expected===null?'—':money(expected)}</div><p class="muted" style="font-size:12px">Weighted across Delhi rematch (₹100), Jaipur rematch (₹87), and partial reverse (₹41), after operating costs.</p><div class="controls-grid"><div><label for="delhi-share">Delhi rematch share (%)</label><input id="delhi-share" type="number" min="0" max="100" value="${form.delhiShare}"></div><div><label for="jaipur-share">Jaipur rematch share (%)</label><input id="jaipur-share" type="number" min="0" max="100" value="${form.jaipurShare}"></div></div><div class="callout ${expected===null?'pink':''}"><strong>${expected===null?'Shares must total 100% or less':'Deck default: 20% + 25% + 55%'}</strong>${expected===null?'Reduce the match shares to leave a valid partial-reverse share.':`${form.delhiShare}% × ₹100 + ${form.jaipurShare}% × ₹87 + ${100-form.delhiShare-form.jaipurShare}% × ₹41 = ${money(expected)}`}</div><div class="micro-chart"><div class="bar" style="height:90px;background:#620555"><b>₹100</b></div><div class="bar" style="height:78px;background:#f80980"><b>₹87</b></div><div class="bar" style="height:37px;background:#ffd36d"><b>₹41</b></div></div><div class="chart-labels"><span>Delhi rematch</span><span>Jaipur rematch</span><span>Partial reverse</span></div><p class="help-text">The supplied deck rounds its default result to approximately ₹64. No measured model or pilot performance is claimed here.</p>`)}${panel('Operational guardrails','Limits drawn from the supplied proposal',`<div class="check-row"><span>Reuse hold period</span>${pill('≤7 days','plum')}</div><div class="check-row"><span>Hub inventory share</span>${pill('≤15%','plum')}</div><div class="check-row"><span>Reuse pilot match-rate gate</span>${pill('≥30%','plum')}</div><div class="check-row"><span>Pause: net savings per order</span>${pill('<₹40','warning')}</div><div class="check-row"><span>Pause: rider attrition increase</span>${pill('>5%','warning')}</div><div class="check-row"><span>Pause: delivery SLA breach</span>${pill('>2 days','warning')}</div><div class="callout spaced"><strong>Planning assumptions, awaiting pilot validation</strong>Targets in the deck need a controlled pilot and measured outcomes. The current prototype demonstrates workflows and policy checks.</div>`)}</div><div class="spaced">${panel('Exportable decision trail','Action records include parcel, timestamp, decision and simulated savings',events(false),btn('Export JSON','export','secondary small'))}</div>`;}
function nudgeModal(){const o=order();return `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="row between"><div><div class="eyebrow muted">AddressSense · Message preview</div><h2 id="modal-title" style="margin-top:8px">A small nudge. A clear answer.</h2></div>${btn(icon('close'),'close-modal','secondary small')}</div><div class="modal-grid"><div><p class="muted" style="font-size:12px">Show the buyer the parcel, address context, and a delivery window. Confirmation should take one tap.</p><div class="facts"><div class="fact"><span>Parcel</span><strong>${o.id}</strong></div><div class="fact"><span>Channel</span><strong>WhatsApp · simulated</strong></div><div class="fact"><span>Sample message cost</span><strong>₹0.28</strong></div><div class="fact"><span>Silence policy</span><strong>Proceed automatically after 30 min</strong></div></div><div class="callout spaced"><strong>Delivery continues if the buyer stays silent</strong>Pending confirmation alone is not a dispatch hold. Address changes and hub mismatches require serviceability revalidation.</div><div class="spaced">${btn(state.nudges[o.id]?'Nudge queued in demo':'Queue simulated nudge','queue-nudge','full-width',!!state.nudges[o.id])}</div><p class="help-text">Queue the nudge, then use the phone’s buttons to simulate a buyer response. No real message is sent.</p></div><div class="phone"><div class="phone-head"><b>Meesho</b><br><small style="color:#d5eae4;text-align:left;padding:4px 0 0">Business account · demo</small></div><div class="message"><p>Hi ${o.customer.split(' ')[0]} 👋<br>Your <b>${o.item.toLowerCase()}</b> is arriving tomorrow.</p><p>📍 ${o.city} · saved delivery address<br>◷ Tomorrow, 10 AM–2 PM</p><p>Please confirm your delivery slot, or tell us if your address has changed.</p>${btn('✓ Confirm delivery','buyer-confirm','',!state.nudges[o.id])}${btn('Change address','buyer-address','',!state.nudges[o.id])}</div><small>Prototype preview · synthetic recipient</small></div></div></section></div>`;}
function demoBanner(){const steps=['Choose a high-risk order and queue a confirmation nudge.','Queue the nudge, then confirm delivery on the buyer preview.','Load a genuine attempt and run RiderTrust verification.','Send an offer, accept it, re-dispatch, then simulate the delivery outcome.','Switch Delhi demand off to see Jaipur win. Commit a route.','Inspect the economics and export your decision trail.'];return demoStep>=0?`<div class="demo-banner"><span><b>Guided demo · ${demoStep+1} / 6</b> &nbsp; ${steps[demoStep]}</span>${btn('Exit','exit-demo','ghost small')}</div>`:'';}
function render(){const content={overview,prevent,recover,reuse,intercept,impact}[view]();$('#app').innerHTML=`<div class="layout" ${modal?'inert':''}><aside class="sidebar"><div class="brand"><div class="brand-mark"><span class="brand-icon">v</span><span class="brand-name">VALMO</span></div><p>DECISION STUDIO</p></div><div class="nav-label">OPERATIONS WORKSPACE</div><nav class="nav" aria-label="Main navigation">${nav.map(([v,i,t],idx)=>`<button data-view="${v}" class="${view===v?'active':''}" ${view===v?'aria-current="page"':''}>${icon(i)}${t}<span class="index">0${idx+1}</span></button>`).join('')}</nav><div class="sidebar-bottom"><div class="sidebar-note"><strong>More deliveries.<br>Brighter futures.</strong><p>A more inclusive,<br>connected Bharat.</p></div><div class="row"><div class="avatar" style="background:#873475;color:white">NG</div><div class="team"><b style="color:white">NewGenLabs</b><br>IIT (BHU) · DICE Challenge</div></div></div></aside><main><header class="topbar"><div class="breadcrumb">Workspace &nbsp; / &nbsp; <b>${nav.find(n=>n[0]===view)[2]}</b></div><div class="top-actions">${pill('<span class="dot"></span> Interactive demo · v2','plum')}${btn(icon('reset')+'Reset demo','reset','ghost small')}<span class="avatar">NG</span></div></header><div class="content">${heading()}${demoBanner()}${content}<footer class="footer"><span><strong>VALMO Engine</strong> &nbsp; · &nbsp; Meesho DICE Challenge · NewGenLabs</span><span>Synthetic orders · illustrative scores · simulated integrations</span></footer></div></main></div>${modal?nudgeModal():''}`;bind();if(modal)$('[data-action="close-modal"]').focus();}
function bind(){document.querySelectorAll('[data-view]').forEach(el=>el.addEventListener('click',()=>{modal=false;demoStep=-1;navigateView(el.dataset.view);render();window.scrollTo(0,0);}));document.querySelectorAll('[data-select]').forEach(el=>el.addEventListener('click',()=>{selectOrder(el.dataset.select);render();}));document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>act(el.dataset.action)));$('#order-select')?.addEventListener('change',e=>{selectOrder(e.target.value);render();});$('#search')?.addEventListener('input',e=>{search=e.target.value;$('#order-rows').innerHTML=orderRows();document.querySelectorAll('[data-select]').forEach(el=>el.addEventListener('click',()=>{selectOrder(el.dataset.select);render();}));});const controls={'hub-match':['hubMatch','bool'],'gps':['gps','number'],'call':['call','number'],'reason':['reason','text'],'seller':['optIn','bool'],'defect':['defect','bool'],'reuse-policy':['policyAllowed','bool'],'reuse-hub':['atHub','bool'],'reuse-hours':['refusalHours','number'],'reuse-buyer':['buyerId','text'],'reuse-mismatch':['mismatchAccepted','bool'],'hold':['hold','number'],'capacity':['capacity','number'],'delhi':['delhi','bool'],'jaipur':['jaipur','bool'],'intercept-eligible':['interceptEligible','bool'],'intent':['intent','number'],'delhi-share':['delhiShare','number'],'jaipur-share':['jaipurShare','number']};for(const [id,[key,type]] of Object.entries(controls)){const el=$('#'+id);if(!el)continue;const updateControl=e=>{const plan=state.reuse[order().id];if(view==='reuse'&&['dispatched','delivered','returned'].includes(plan?.status))return;if(view==='reuse'&&key!=='mismatchAccepted'&&['offered','accepted'].includes(plan?.status)){delete state.reuse[order().id];form.mismatchAccepted=false;toast('Parcel rules changed. Review and send a new offer.');}form[key]=type==='bool'?e.target.checked:type==='number'?Math.max(0,Number(e.target.value)||0):e.target.value;if(['gps','call'].includes(key)){state.verified[order().id]=false;if(['offered','accepted'].includes(plan?.status))delete state.reuse[order().id];}save();render();if(e.type==='input')$('#'+id)?.focus();};el.addEventListener('change',updateControl);if(['hold','capacity','refusalHours'].includes(key))el.addEventListener('input',e=>{if(e.target.value!=='')updateControl(e);});if(['gps','call'].includes(key))el.addEventListener('input',e=>{$('#'+key+'-value').textContent=e.target.value+(key==='gps'?' m':' sec');});}}
function toast(text){$('#toast').textContent=text;$('#toast').classList.add('visible');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').classList.remove('visible'),4000);}
function act(action){const o=order();switch(action){case 'inspect':view=o.stage==='In transit'?'intercept':o.stage==='Delivery attempt'?'recover':'prevent';break;case 'nudge':modal=true;break;case 'close-modal':modal=false;break;case 'queue-nudge':state.nudges[o.id]=true;emit(o.id+':nudge','Confirmation nudge queued','Synthetic WhatsApp preview · ₹0.28 sample cost');break;case 'buyer-confirm':state.responses[o.id]='confirmed';emit(o.id+':confirmed','Buyer confirmed delivery','Original order preserved; savings not counted as realised');modal=false;break;case 'buyer-address':state.responses[o.id]='address';emit(o.id+':address','Address correction requested','Hold for serviceability revalidation');modal=false;break;case 'dispatch':emit(o.id+':dispatch','Dispatch approved','Low-risk sample and serviceable hub');break;case 'hub-correct':emit(o.id+':hub','Hub mismatch flagged','Reroute before handover');form.hubMatch=true;break;case 'genuine':form.gps=184;form.call=22;state.verified[o.id]=false;save();break;case 'audit':{if(o.stage!=='Delivery attempt'){toast('Select a parcel with a delivery attempt.');return;}const a=auditAttempt(form.gps,form.call);state.verified[o.id]=a.verified;emit(o.id+(a.verified?':audit-verified':':audit-blocked'),a.verified?'Delivery attempt verified':'Re-attempt required',`${form.gps} m distance · ${form.call} sec masked call`);break;}case 'to-reuse':navigateView('reuse');break;case 'to-recover':navigateView('recover');break;case 'reuse-offer':case 'reuse-accept':case 'reuse-dispatch':case 'reuse-deliver':case 'reuse-reverse':case 'reuse-decline':reuseAction(action.slice(6));break;case 'triage':{const d=reuseDecision({...form,stage:o.stage,verified:!!state.verified[o.id],velocity:o.velocity});emit(o.id+':triage:'+form.reason+':'+d.action,d.action,d.description);break;}case 'commit-route':{const d=interception({risk:form.intent/100,delhi:form.delhi,jaipur:form.jaipur,eligible:form.interceptEligible});if(!d.allowed)return;if(state.actions[o.id+':reuse']){toast('This parcel already has a committed reuse route. Reset the demo to explore interception.');return;}emit(o.id+':intercept',d.action,'Total cost '+money(d.total)+' incl. operations',d.saving);break;}case 'export':{const report={product:'VALMO Decision Studio',mode:'synthetic-demo',exportedAt:new Date().toISOString(),policy,summary:{actions:state.events.length,simulatedSavings:state.savings},events:state.events,planningScenario:{delhiShare:form.delhiShare,jaipurShare:form.jaipurShare,expectedNetSaving:weightedSavings(form.delhiShare,form.jaipurShare)},limitations:['No trained GNN inference','No real WhatsApp, GeoIndia, GPS or order-system integration','No measured pilot impact'],reuseJourneys:state.reuse};const url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='valmo-demo-run.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Demo run exported as JSON.');return;}case 'reset':state=fresh();form={...form,hubMatch:true,gps:650,call:0,reason:'refusal',defect:false,optIn:true,policyAllowed:true,atHub:true,refusalHours:6,buyerId:'exact',mismatchAccepted:false,fit:'high',hold:2,capacity:9,delhi:true,jaipur:true,intent:87,interceptEligible:true,delhiShare:20,jaipurShare:25};demoStep=-1;view='overview';modal=false;save();toast('Demo reset.');break;case 'exit-demo':demoStep=-1;break;case 'demo':demoStep=(demoStep+1)%6;view=['prevent','prevent','recover','reuse','intercept','impact'][demoStep];if(demoStep<2)selectOrder('VAL-9821');if(demoStep===2||demoStep===3)selectOrder('VAL-8842');if(demoStep===4)selectOrder('VAL-5519');if(demoStep===1)modal=true;break;}render();}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=false;render();$('[data-action="nudge"]')?.focus();}if(e.key==='Tab'&&modal){const items=[...document.querySelectorAll('.modal button:not([disabled]),.modal input,.modal select')];if(e.shiftKey&&document.activeElement===items[0]){e.preventDefault();items.at(-1)?.focus();}else if(!e.shiftKey&&document.activeElement===items.at(-1)){e.preventDefault();items[0]?.focus();}}});
render();
</script></body>
